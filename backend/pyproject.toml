[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "livekit-api>=1.2.1",
    "psycopg[binary]>=3.2.10",
    "pytest>=9.1.1",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
